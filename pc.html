<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>단가 관리</title>
<meta name="theme-color" content="#1f5c87">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="common.css">
<style>
/* PC: left menu + page header with save/undo + one working area; price table is Excel-like with a right-side history drawer */
.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:16px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;padding:2px 6px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;flex:none}
.brand b{display:block;font-size:15px;line-height:1.2}
.brand small{color:var(--muted);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--accent-weak);color:var(--accent);font-weight:600}
.nav .sep{height:1px;background:var(--line);margin:6px 8px}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;padding:0 6px}
.side-foot kbd{font-family:var(--font-num);font-size:11px;background:var(--surface-2);border-radius:4px;padding:1px 5px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px 12px;padding:14px 24px 10px;flex-wrap:wrap}
.topbar .titles{margin-right:auto;min-width:0}
.topbar h1{margin:0;font-size:20px;letter-spacing:-.01em}
.topbar .desc{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.content{padding:6px 24px 56px;min-width:0}
.view{display:flex;flex-direction:column;gap:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.toolbar .field{width:auto}
.toolbar .grow{flex:1 1 200px}
.toolbar input[type=date]{width:150px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px;border:1px solid var(--line)}
.sw.chg{background:var(--chg)} .sw.buy{background:var(--buy)}
.sw.fut{background:none;border:none;width:0;height:0;border-top:7px solid var(--future);border-left:7px solid transparent}
.cols-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px;align-items:start}

.scroller{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:calc(100vh - 300px);min-height:300px}
table.grid{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.grid th,.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 8px;white-space:nowrap}
.grid thead th{position:sticky;background:var(--surface-2);font-weight:600;font-size:12px;text-align:center;z-index:3;line-height:1.3}
.grid thead tr.g th{top:0;height:24px;font-size:11px;color:var(--muted);letter-spacing:.04em}
.grid thead tr.h th{top:24px;white-space:normal;min-width:64px;max-width:80px;word-break:keep-all}
.grid thead th.buy{background:var(--buy-head)}
.grid .c1,.grid .c2,.grid .md{position:sticky;background:var(--surface);z-index:2}
.grid thead .c1,.grid thead .c2,.grid thead .md{z-index:4;background:var(--surface-2)}
.grid .c1{left:0;width:78px;min-width:78px;max-width:78px;white-space:normal;word-break:keep-all;font-weight:600}
.grid .c2{left:78px;width:78px;min-width:78px;max-width:78px;white-space:normal;word-break:keep-all;color:var(--muted)}
.grid .md{left:156px;min-width:150px;font-family:var(--font-num);border-right:2px solid var(--line-strong)}
.grid td.c1,.grid td.c2{vertical-align:middle;text-align:center;font-size:12px}
.grid td.v{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums;cursor:pointer;position:relative;min-width:64px}
.grid td.v.buy{background:var(--buy)}
.grid td.v:hover,.grid td.v.sel{outline:2px solid var(--accent);outline-offset:-2px}
.grid td.v.chg{background:var(--chg);color:var(--chg-fg);font-weight:500}
.grid td.v.chg .cur{color:inherit}
.grid td.v.txt{text-align:left;font-family:var(--font-ui);font-size:12px;color:var(--muted);max-width:140px;overflow:hidden;text-overflow:ellipsis}
.grid td.v.fut::after{content:"";position:absolute;top:0;right:0;border-top:7px solid var(--future);border-left:7px solid transparent}
.grid tbody tr:hover td.md{color:var(--accent)}
.grid .editable{cursor:pointer}
.grid th.editable:hover,.grid td.md.editable:hover{text-decoration:underline;color:var(--accent)}
.grid td.neg{color:var(--up);font-weight:600}
.grid td.low{color:var(--warn)}
.grid td.na{color:var(--muted);font-family:var(--font-ui);font-size:11px;text-align:center}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:40;display:flex;flex-direction:column}
.drawer-head{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer-head .t{flex:1;min-width:0}
.drawer-head .t div{font-size:12px;color:var(--muted)}
.drawer-head .t strong{font-size:16px;font-family:var(--font-num)}
.drawer-body{overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:16px}
.scrim{position:fixed;inset:0;background:rgba(10,20,30,.25);z-index:35}
.toast{bottom:24px}

@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 12px;border-right:none;border-bottom:1px solid var(--line);gap:10px}
  .nav{flex-direction:row}
  .nav .sep,.side-foot,.brand small{display:none}
  .topbar,.content{padding-left:16px;padding-right:16px}
  .scroller{max-height:calc(100vh - 260px)}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="#home"><span class="logo">단</span><span><b>단가 관리</b><small id="brandSub"></small></span></a>
    <nav class="nav" id="nav" aria-label="메뉴"></nav>
    <div class="side-foot">
      <a href="mobile.html">핸드폰 화면 열기</a>
      <span><kbd>Ctrl</kbd>+<kbd>S</kbd> 저장 · <kbd>Ctrl</kbd>+<kbd>Z</kbd> 되돌리기 · <kbd>/</kbd> 검색</span>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="titles"><h1 id="pageTitle"></h1><p class="desc" id="pageDesc"></p></div>
      <button class="btn" id="btnUndo" type="button">↶ 되돌리기</button>
      <span class="pill" id="pill"></span>
      <button class="btn primary" id="btnSave" type="button">드라이브에 저장</button>
    </header>
    <main class="content">
      <section class="view" id="v-home" hidden><div id="homeBox"></div></section>

      <section class="view" id="v-table" hidden>
        <div class="toolbar">
          <label class="field"><span>기준일</span><input type="date" id="tDate"></label>
          <label class="field grow"><span>모델 · 구분 검색</span><input type="search" id="tSearch" placeholder="예: 102 S 0580, AF, 소결"></label>
          <label class="field"><span>대구분</span><select id="tCat"></select></label>
          <label class="field"><span>변경 표시</span><select id="tHi"><option value="30">최근 30일 변경</option><option value="7">최근 7일 변경</option><option value="90">최근 90일 변경</option><option value="all">기준 단가 이후 전체</option><option value="off">표시 안 함</option></select></label>
          <div class="field"><span>외화 단가 표시</span><div class="seg mini" id="krwSeg"><button type="button" data-k="0">원래 통화</button><button type="button" data-k="1">원화 환산</button></div></div>
          <label class="check"><input type="checkbox" id="tHideEmpty"> 빈 거래처 열 숨기기</label>
        </div>
        <div class="toolbar">
          <div class="legend"><span><i class="sw buy"></i>매입가</span><span><i class="sw chg"></i>기간 내 변경</span><span><i class="sw fut"></i>적용 예정 있음</span><span>외화는 통화 표시(예: <span class="cur">EUR</span>), 원화 환산 값은 점선 밑줄</span></div>
          <div class="row" style="margin-left:auto"><button class="btn small" type="button" id="btnAddItem">+ 품목 추가</button><button class="btn small" type="button" id="btnBulk">엑셀 일괄 변경</button><button class="btn small" type="button" id="btnPct">비율 인상 · 인하</button><button class="btn small" type="button" id="btnExport">내보내기</button></div>
        </div>
        <p class="hint" style="margin:-6px 0 0">칸을 누르면 이력과 단가 변경, MODEL이나 거래처 이름을 누르면 수정 · 삭제할 수 있습니다.</p>
        <div id="tEmpty" hidden></div>
        <div class="scroller" id="tScroll"><table class="grid" id="tGrid"></table></div>
      </section>

      <section class="view" id="v-history" hidden></section>
      <section class="view" id="v-analysis" hidden><div id="anaBox"></div></section>
      <section class="view" id="v-margin" hidden><div id="marBox"></div></section>
      <section class="view" id="v-tools" hidden><div id="toolsBox"></div></section>
      <section class="view" id="v-manage" hidden><div class="cols-2" id="manageBox"></div></section>
      <section class="view" id="v-setup" hidden><div class="cols-2" id="setupBox"></div></section>
    </main>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="단가 이력">
  <div class="drawer-head"><div class="t"><div id="dPath"></div><strong id="dModel"></strong><div id="dCol"></div></div><button class="btn small" type="button" id="dClose">닫기</button></div>
  <div class="drawer-body" id="dBody"></div>
</aside>

<script src="core.js"></script>
<script src="tools.js"></script>
<script>
(function(){
"use strict";
const A=Danga,{$,esc,today,addDays}=A;
const VIEWS=[
  {id:'home',label:'홈',icon:'home',title:'홈',desc:'오늘 확인할 것과 자주 쓰는 작업'},
  {id:'table',label:'단가표',icon:'table',title:'단가표',desc:'기준일의 전체 단가를 보고 바로 바꿉니다'},
  {id:'history',label:'이력',icon:'clock',title:'변경 이력',desc:'단가가 언제, 얼마에서 얼마로, 왜 바뀌었는지 찾아봅니다'},
  {id:'analysis',label:'분석',icon:'chart',title:'분석',desc:'변경 비교, 거래처 비교, 적용 예정 단가'},
  {id:'margin',label:'마진 · 환율',icon:'percent',title:'마진 · 환율',desc:'마진표, 원가 변동 시뮬레이션, 환율 관리'},
  {id:'tools',label:'작업 도구',icon:'tools',title:'작업 도구',desc:'일괄 변경, 거래처별 단가표, 내보내기'},
  {id:'manage',label:'품목 · 거래처',icon:'folder',title:'품목 · 거래처 관리',desc:'이름 변경, 삭제, 복원'},
  {id:'setup',label:'설정',icon:'gear',title:'저장 · 설정',desc:'구글 드라이브 저장, 엑셀 가져오기, 기본 설정'}
];
$('#nav').innerHTML=VIEWS.map((v,i)=>(i===1||i===5?'<div class="sep"></div>':'')+'<a href="#'+v.id+'" data-view="'+v.id+'">'+A.icon(v.icon,18)+'<span>'+esc(v.label)+'</span></a>').join('');
let selCell=null,hist,anaHub,marHub,toolsHub,homeHub,manage,setup;

/* ---------- price table ---------- */
function gridHtml(rows,cols,cellFn,opt){
  opt=opt||{};const buy=cols.filter(c=>c.group==='buy'),sell=cols.filter(c=>c.group!=='buy');
  let h='<thead><tr class="g"><th class="c1" rowspan="2">대구분</th><th class="c2" rowspan="2">소구분</th><th class="md" rowspan="2">MODEL</th>';
  if(buy.length)h+='<th class="buy" colspan="'+buy.length+'">'+esc(opt.buyLabel||'매입가')+'</th>';
  if(sell.length)h+='<th colspan="'+sell.length+'">'+esc(opt.sellLabel||'판매처')+'</th>';
  h+='</tr><tr class="h">'+cols.map(c=>{const real=!c.key.startsWith('__');return '<th class="'+(c.group==='buy'?'buy':'')+(real?' editable':'')+'"'+(real?' data-edit-col="'+esc(c.key)+'" title="눌러서 거래처 수정 · 삭제"':'')+'>'+esc(c.name)+'</th>'}).join('')+'</tr></thead><tbody>';
  if(!rows.length)h+='<tr><td colspan="'+(cols.length+3)+'" class="na" style="padding:24px">조건에 맞는 품목이 없습니다.</td></tr>';
  for(let r=0;r<rows.length;r++){const it=rows[r];h+='<tr>';
    if(r===0||rows[r-1].cat1!==it.cat1){let n=1;while(r+n<rows.length&&rows[r+n].cat1===it.cat1)n++;h+='<td class="c1" rowspan="'+n+'">'+esc(it.cat1)+'</td>'}
    if(r===0||rows[r-1].cat1!==it.cat1||rows[r-1].cat2!==it.cat2){let n=1;while(r+n<rows.length&&rows[r+n].cat1===it.cat1&&rows[r+n].cat2===it.cat2)n++;h+='<td class="c2" rowspan="'+n+'">'+esc(it.cat2)+'</td>'}
    h+='<td class="md editable" data-edit-item="'+esc(it.id)+'" title="눌러서 품목 수정 · 삭제">'+esc(it.model)+'</td>';for(const c of cols)h+=cellFn(it,c);h+='</tr>'}
  return h+'</tbody>';
}
function renderTable(){
  const sel=$('#tCat'),cv=sel.value;sel.innerHTML='<option value="">전체</option>'+A.cats().map(c=>'<option>'+esc(c)+'</option>').join('');sel.value=cv;
  document.querySelectorAll('#krwSeg button').forEach(b=>b.setAttribute('aria-selected',String((b.dataset.k==='1')===A.view.krw)));
  const empty=A.isEmpty();$('#tEmpty').hidden=!empty;$('#tScroll').hidden=empty;
  if(empty){$('#tEmpty').innerHTML='<div class="empty"><b>아직 단가 데이터가 없습니다.</b><span>처음이면 원본 단가.xlsx를 가져오고, 다른 기기에서 저장한 적이 있으면 드라이브에서 불러오세요.</span><a class="btn primary" href="#setup">저장 · 설정으로 가기</a></div>';return}
  const d=$('#tDate').value||today(),q=$('#tSearch').value.trim(),cat=sel.value,hi=$('#tHi').value;
  const since=hi==='off'?null:hi==='all'?'0000':addDays(d,-Number(hi));
  const rows=A.DB.items.filter(it=>A.matchItem(it,q,cat));
  let cols=A.DB.columns;if($('#tHideEmpty').checked)cols=cols.filter(c=>rows.some(it=>A.hasVal(A.entryAt(it.id,c.key,d))));
  $('#tGrid').innerHTML=gridHtml(rows,cols,(it,c)=>{
    const e=A.entryAt(it.id,c.key,d);let cls='v'+(c.group==='buy'?' buy':'');
    if(e&&!A.isNum(e)&&e.t)cls+=' txt';if(A.isChanged(e,since))cls+=' chg';if(A.hasFuture(it.id,c.key,d))cls+=' fut';
    if(selCell&&selCell.i===it.id&&selCell.c===c.key)cls+=' sel';
    let title=c.name+' · '+A.itemName(it);if(e&&!e.base){title+='\n'+e.from+' 변경: '+A.eText(A.prevOf(e))+' → '+A.eText(e)+(e.reason?'\n사유: '+e.reason:'')}else if(e&&e.t)title+='\n'+e.t;
    const kn=A.krwNote(e,d);if(kn)title+='\n'+kn;
    return '<td class="'+cls+'" data-i="'+esc(it.id)+'" data-c="'+esc(c.key)+'" title="'+esc(title)+'">'+A.eHtml(e,d)+'</td>';
  });
  $('#brandSub').textContent=d+' 기준';
}

/* ---------- margin table (inside the 마진 · 환율 tabs) ---------- */
function mountMarginTable(el){
  el.innerHTML='<div class="toolbar"><label class="field"><span>기준일</span><input type="date" id="mDate"></label><label class="field"><span>원가 기준</span><select id="mBasis"><option value="hana">하나테크 우선, 없으면 덕우</option><option value="dukwoo">덕우 우선, 없으면 하나테크</option></select></label><label class="field"><span>표시</span><select id="mMode"><option value="amt">마진 금액 (원)</option><option value="pct">마진율 (판매가 대비 %)</option></select></label><label class="field grow"><span>모델 검색</span><input type="search" id="mSearch"></label><div class="row"><button class="btn small" type="button" id="mXlsx">엑셀로 내보내기</button><button class="btn small" type="button" id="mPdf">PDF로 저장</button></div></div>'+
    '<div class="legend"><span class="up">빨강: 역마진</span><span class="warn-t" id="lowLegend"></span><span>원가 열은 외화를 원으로 환산한 값 · 저마진 기준은 설정에서 바꿉니다</span></div><div class="scroller" id="mScroll"><table class="grid" id="mGrid"></table></div>';
  $('#mDate').value=today();$('#mBasis').value=A.basis();
  ['mDate','mBasis','mMode','mSearch'].forEach(id=>$('#'+id).addEventListener('input',()=>{if(id==='mBasis')A.setBasis($('#mBasis').value);renderMargin()}));
  $('#mXlsx').addEventListener('click',()=>{if(!noData())A.exportMarginXlsx($('#mDate').value||today(),A.basis()).then(()=>A.toast('엑셀 파일을 내려받았습니다.')).catch(e=>A.toast(e.message))});
  $('#mPdf').addEventListener('click',()=>{if(!noData())A.printMargin($('#mDate').value||today(),A.basis())});
  renderMargin();return{refresh:renderMargin};
}
function renderMargin(){
  const g=$('#mGrid');if(!g)return;
  if(A.isEmpty()){g.innerHTML='';return}
  $('#lowLegend').textContent='주황: 마진율 '+A.lowMargin()+'% 미만';
  const d=$('#mDate').value||today(),basis=$('#mBasis').value,mode=$('#mMode').value,q=$('#mSearch').value.trim(),lm=A.lowMargin();
  const rows=A.DB.items.filter(it=>A.matchItem(it,q,''));
  const cols=[{key:'__cost',name:'원가 (원)',group:'buy'}].concat(A.DB.columns.filter(c=>c.group!=='buy'));
  g.innerHTML=gridHtml(rows,cols,(it,c)=>{
    if(c.key==='__cost'){const cost=A.costAt(it,d,basis);if(!cost)return '<td class="v buy na">-</td>';if(cost.needFx)return '<td class="v buy na">'+esc(cost.e.cur)+' 환율 필요</td>';return '<td class="v buy" title="'+esc(A.eText(cost.e))+'">'+esc(A.fmtN(Math.round(cost.krw*100)/100))+'</td>'}
    const r=A.marginOf(it,c,d,basis);if(!r)return '<td class="v na"></td>';
    if(r.unknown)return '<td class="v na" data-i="'+esc(it.id)+'" data-c="'+esc(c.key)+'" title="원가 또는 환율이 없습니다">?</td>';
    return '<td class="v'+(r.m<0?' neg':r.p<lm?' low':'')+'" data-i="'+esc(it.id)+'" data-c="'+esc(c.key)+'" title="'+esc(c.name+' 판매가 '+A.eText(r.s)+' − 원가 '+A.fmtN(Math.round(r.cost.krw))+'원 = '+A.fmtN(Math.round(r.m*100)/100)+'원 ('+r.p.toFixed(1)+'%)')+'">'+esc(mode==='pct'?r.p.toFixed(1)+'%':A.fmtN(Math.round(r.m*100)/100))+'</td>';
  },{buyLabel:'원가',sellLabel:mode==='pct'?'마진율':'마진 금액 (판매가 − 원가)'});
}
const noData=()=>{if(A.isEmpty()){A.toast('단가 데이터가 없습니다. 설정에서 엑셀을 가져오세요.');return true}return false};

/* ---------- cell drawer ---------- */
function openCell(i,c){
  const it=A.ITEM.get(i),col=A.COL.get(c);if(!it||!col)return;selCell={i,c};
  $('#dPath').textContent=A.itemLabel(it);$('#dModel').textContent=it.model||'(모델 없음)';$('#dCol').textContent=col.name+(col.group==='buy'?' · 매입가':' · 판매가');
  A.renderCell($('#dBody'),i,c,{date:$('#tDate').value});$('#drawer').hidden=false;$('#scrim').hidden=false;if(cur()==='table')renderTable();
}
function closeDrawer(){$('#drawer').hidden=true;$('#scrim').hidden=true;selCell=null;if(cur()==='table')renderTable()}
$('#dClose').addEventListener('click',closeDrawer);$('#scrim').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal')&&!$('#modal').hidden)A.closeModal();else if(!$('#drawer').hidden)closeDrawer()}});
document.addEventListener('danga:undo',()=>{if(selCell&&!$('#drawer').hidden)A.renderCell($('#dBody'),selCell.i,selCell.c,{date:$('#tDate').value})});
document.addEventListener('click',ev=>{
  const ei=ev.target.closest('[data-edit-item]');if(ei){A.editItemDialog(ei.dataset.editItem);return}
  const ec=ev.target.closest('[data-edit-col]');if(ec){A.editColDialog(ec.dataset.editCol);return}
  const t=ev.target.closest('[data-i][data-c]');if(t&&!ev.target.closest('#drawer')&&!ev.target.closest('#modal'))openCell(t.dataset.i,t.dataset.c);
});

/* ---------- navigation ---------- */
const cur=()=>{const v=location.hash.slice(1);return VIEWS.some(x=>x.id===v)?v:'home'};
const ctx={
  date:()=>$('#tDate').value||today(),cat:()=>$('#tCat').value,
  find:()=>{location.hash='#table';setTimeout(()=>$('#tSearch').focus(),60)},
  goto:name=>{if(name==='upcoming'){location.hash='#analysis';anaHub.show('upcoming')}else if(name==='fx'){location.hash='#margin';marHub.show('fx')}else if(name==='settings')location.hash='#setup';else location.hash='#'+name}
};
function render(){
  const v=cur();
  if(v==='home')homeHub.refresh();
  else if(v==='table')renderTable();
  else if(v==='history')hist.refresh();
  else if(v==='analysis')anaHub.refresh();
  else if(v==='margin')marHub.refresh();
  else if(v==='manage')manage.refresh();
  else if(v==='setup')setup.refresh();
}
function route(){
  const v=cur(),def=VIEWS.find(x=>x.id===v);
  VIEWS.forEach(x=>$('#v-'+x.id).hidden=x.id!==v);
  document.querySelectorAll('#nav a').forEach(a=>{if(a.dataset.view===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('#pageTitle').textContent=def.title;$('#pageDesc').textContent=def.desc;document.title=def.title+' · 단가 관리';
  if(!$('#drawer').hidden)closeDrawer();
  render();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ---------- wiring ---------- */
['tDate','tSearch','tCat','tHi','tHideEmpty'].forEach(id=>$('#'+id).addEventListener('input',()=>{renderTable();A.LS.set('danga.pc',{hi:$('#tHi').value,hide:$('#tHideEmpty').checked})}));
$('#krwSeg').addEventListener('click',ev=>{const b=ev.target.closest('button[data-k]');if(b)A.setKrw(b.dataset.k==='1')});
$('#btnSave').addEventListener('click',()=>A.save());
$('#btnAddItem').addEventListener('click',()=>A.runTool('add',ctx));
$('#btnBulk').addEventListener('click',()=>A.runTool('bulk',ctx));
$('#btnPct').addEventListener('click',()=>A.runTool('pct',ctx));
$('#btnExport').addEventListener('click',()=>A.runTool('export',ctx));
$('#btnUndo').innerHTML=A.icon('undo',16)+' 되돌리기';$('#btnUndo').style.gap='6px';A.bindUndo($('#btnUndo'));
A.bindShortcuts({search:()=>ctx.find()});
let rT;A.onChange(()=>{A.renderPill($('#pill'));$('#btnSave').disabled=A.isBusy();clearTimeout(rT);rT=setTimeout(render,30)});

/* ---------- boot ---------- */
$('#tDate').value=today();
const p=A.LS.get('danga.pc');if(p){if(p.hi)$('#tHi').value=p.hi;$('#tHideEmpty').checked=!!p.hide}
homeHub=A.mountHome($('#homeBox'),ctx);
hist=A.mountHistory($('#v-history'));
anaHub=A.mountTabs($('#anaBox'),[{id:'diff',label:'변경 비교',mount:el=>A.mountAnalysis(el)},{id:'compare',label:'거래처 비교',mount:el=>A.mountCompare(el)},{id:'upcoming',label:'적용 예정 단가',mount:el=>A.mountUpcoming(el)}],'ana');
marHub=A.mountTabs($('#marBox'),[{id:'table',label:'마진표',mount:mountMarginTable},{id:'sim',label:'원가 변동 시뮬레이션',mount:el=>A.mountSim(el)},{id:'fx',label:'환율',mount:el=>{el.innerHTML='<div class="section" id="fxBox"></div>';return A.mountFx($('#fxBox'))}}],'mar');
toolsHub=A.mountTools($('#toolsBox'),ctx);
manage=A.mountManage($('#manageBox'));
setup=A.mountSettings($('#setupBox'));
A.renderPill($('#pill'));route();A.autoSync();
})();
</script>
</body>
</html>
