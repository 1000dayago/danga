<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>단가 관리</title>
<meta name="theme-color" content="#1f5c87">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="common.css?v=19">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.box{width:min(420px,100%);display:flex;flex-direction:column;gap:14px;text-align:center}
.box img{width:72px;height:72px;margin:0 auto;border-radius:16px}
h1{margin:0;font-size:22px}
.btns{display:grid;gap:10px}
.btns .btn{padding:14px;font-size:16px}
</style>
<script>
(function(){
  var pick=null;try{pick=localStorage.getItem('danga.device')}catch(e){}
  var p=new URLSearchParams(location.search);
  if(p.get('choose')!=null)return;
  if(!pick)pick=(matchMedia('(max-width: 820px)').matches||/Android|iPhone|iPod/i.test(navigator.userAgent))?'mobile':'pc';
  location.replace(pick+'.html');
})();
</script>
</head>
<body>
<div class="box">
  <img src="icons/icon-192.png" alt="">
  <h1>단가 관리</h1>
  <p class="hint">사용할 화면을 고르세요. 고른 화면은 이 기기에서 기억합니다.</p>
  <div class="btns">
    <a class="btn primary" href="pc.html" data-dev="pc">PC 화면</a>
    <a class="btn" href="mobile.html" data-dev="mobile">핸드폰 화면</a>
  </div>
</div>
<script>
document.querySelectorAll('[data-dev]').forEach(function(a){a.addEventListener('click',function(){try{localStorage.setItem('danga.device',a.dataset.dev)}catch(e){}})});
</script>
</body>
</html>
