<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>단가 관리</title>
<meta name="theme-color" content="#1f5c87">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="단가 관리">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="common.css">
<style>
/* Mobile: app bar (title, undo, save) + five bottom tabs; 단가 tab = item list -> item detail with each customer's price; history opens as a bottom sheet */
body{font-size:15px;padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
input[type=text],input[type=date],input[type=number],input[type=search],select{font-size:16px}
.gut{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.bar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar-row{display:flex;align-items:center;gap:8px;height:54px}
.bar h1{font-size:17px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:none;background:none;padding:8px;font-size:22px;line-height:1;cursor:pointer;color:var(--fg);border-radius:8px}
.iconbtn:disabled{opacity:.3}
#back{margin-left:-8px}
.search{padding-block:0 10px;display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.datechip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.datechip input{width:auto;padding:4px 8px;font-size:14px}
main{padding-block:12px 24px;display:flex;flex-direction:column;gap:12px}
main>section{display:flex;flex-direction:column;gap:12px;min-width:0}
.grp{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;padding:10px 2px 4px}
.items{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.irow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:none;border-right:none;border-top:none;width:100%}
.irow:last-child{border-bottom:none}
.irow:active{background:var(--surface-2)}
.irow .l{flex:1;min-width:0}
.irow .m{font-family:var(--font-num);font-weight:500;font-size:15px}
.irow .s{font-size:12px;color:var(--muted)}
.irow .r{text-align:right;font-family:var(--font-num)}
.irow .r small{display:block;font-family:var(--font-ui);font-size:11px;color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:2px}
.star{color:var(--warn);margin-left:4px}
.chev{color:var(--line-strong);font-size:18px}
.detail-head{display:flex;flex-direction:column;gap:2px}
.detail-head .m{font-family:var(--font-num);font-size:22px;font-weight:500}
.prow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.prow:last-child{border-bottom:none}
.prow:active{background:var(--surface-2)}
.prow .n{font-weight:500}
.prow .v{font-family:var(--font-num);font-size:16px;text-align:right}
.prow .sub{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.prow.chg .v{background:var(--chg);color:var(--chg-fg);padding:0 6px;border-radius:4px}
.prow.none .v{color:var(--muted);font-size:13px}
.mg{font-family:var(--font-num)}
.mg.neg{color:var(--up);font-weight:600}.mg.low{color:var(--warn)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:500}
.tabbar a[aria-current="page"]{color:var(--accent)}
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(10,20,30,.35)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:14px 14px 0 0;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-head .t{flex:1;min-width:0}
.sheet-head .t div{font-size:12px;color:var(--muted)}
.sheet-head .t strong{font-family:var(--font-num);font-size:17px}
.sheet-body{overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.form{grid-template-columns:1fr 1fr}
.filters{grid-template-columns:1fr 1fr}
.filters h2{grid-column:1/-1}
.toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.timeline li{grid-template-columns:84px 1fr}
.savebtn{padding:6px 12px}
.pill{max-width:34vw;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;padding:3px 8px}
.seg button{padding:7px 10px}
.seg.mini button{padding:4px 9px}
.tiles{grid-template-columns:1fr 1fr}
.statrow{grid-template-columns:1fr 1fr}
.cols-1{display:flex;flex-direction:column;gap:12px}
</style>
</head>
<body>
<header class="bar">
  <div class="gut bar-row">
    <button class="iconbtn" id="back" type="button" aria-label="뒤로" hidden>‹</button>
    <h1 id="title">단가 관리</h1>
    <button class="iconbtn" id="btnUndo" type="button" aria-label="되돌리기">↶</button>
    <span class="pill" id="pill"></span>
    <button class="btn primary small savebtn" id="btnSave" type="button">저장</button>
  </div>
  <div class="gut search" id="searchBar" hidden>
    <input type="search" id="q" placeholder="모델 · 구분 검색 (예: 0580, AF, 소결)" aria-label="검색">
    <div class="chips" id="chips"></div>
    <div class="datechip"><span>기준일</span><input type="date" id="date"><span id="dateNote"></span><div class="seg mini" id="krwSeg" aria-label="외화 단가 표시"><button type="button" data-k="0">원래 통화</button><button type="button" data-k="1">원화 환산</button></div></div>
  </div>
</header>

<main class="gut">
  <section id="v-home"><div id="homeBox"></div></section>
  <section id="v-prices" hidden></section>
  <section id="v-item" hidden></section>
  <section id="v-history" hidden></section>
  <section id="v-analysis" hidden><div id="anaBox"></div></section>
  <section id="v-more" hidden><div id="moreBox"></div></section>
</main>

<nav class="tabbar" id="tabbar" aria-label="메뉴"></nav>

<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="단가 이력">
  <div class="sheet-head"><div class="t"><div id="sPath"></div><strong id="sModel"></strong><div id="sCol"></div></div><button class="btn small" type="button" id="sClose">닫기</button></div>
  <div class="sheet-body" id="sBody"></div>
</div>

<script src="core.js"></script>
<script src="tools.js"></script>
<script>
(function(){
"use strict";
const A=Danga,{$,esc,today,addDays}=A;
const TABS=[{id:'home',label:'홈',icon:'home'},{id:'prices',label:'단가',icon:'table'},{id:'history',label:'이력',icon:'clock'},{id:'analysis',label:'분석',icon:'chart'},{id:'more',label:'더보기',icon:'more'}];
const VIEWS=['home','prices','item','history','analysis','more'];
const TITLES={home:'단가 관리',prices:'단가',history:'변경 이력',analysis:'분석',more:'더보기'};
$('#tabbar').innerHTML=TABS.map(t=>'<a href="#'+t.id+'" data-tab="'+t.id+'">'+A.icon(t.icon,22)+t.label+'</a>').join('');
let keepMoreTab=false,cat='',favOnly=false,curItem=A.LS.get('danga.m.item'),showAll=false,showMargin=true,homeHub,hist,anaHub,moreHub,sheetCell=null;
const date=()=>$('#date').value||today();

/* ---------- 단가 list ---------- */
function renderChips(){
  const cs=A.cats();if(cat&&!cs.includes(cat))cat='';
  $('#chips').innerHTML='<button class="chip" type="button" data-fav aria-pressed="'+favOnly+'">★ 즐겨찾기</button>'+['',...cs].map(c=>'<button class="chip" type="button" data-cat="'+esc(c)+'" aria-pressed="'+(c===cat)+'">'+esc(c||'전체')+'</button>').join('');
  document.querySelectorAll('#krwSeg button').forEach(b=>b.setAttribute('aria-selected',String((b.dataset.k==='1')===A.view.krw)));
}
function renderPrices(){
  renderChips();const el=$('#v-prices');
  if(A.isEmpty()){el.innerHTML='<div class="empty"><b>아직 단가 데이터가 없습니다.</b><span>설정에서 원본 단가.xlsx를 가져오거나, 드라이브에서 불러오세요.</span><a class="btn primary" href="#more">설정으로 가기</a></div>';return}
  const d=date(),since=addDays(d,-30),q=$('#q').value.trim();
  const rows=A.DB.items.filter(it=>A.matchItem(it,q,cat)&&(!favOnly||A.isFav(it.id)));
  if(!rows.length){el.innerHTML='<div class="empty"><b>'+(favOnly?'즐겨찾기한 품목이 없습니다.':'검색 결과가 없습니다.')+'</b>'+(favOnly?'품목 화면의 ☆를 눌러 자주 보는 품목을 등록하세요.':'검색어나 대구분을 바꿔 보세요. 새 품목이면 추가할 수 있습니다.')+'<button class="btn primary" type="button" data-additem>+ 품목 추가</button></div>';return}
  const buys=A.DB.columns.filter(c=>c.group==='buy'),sells=A.DB.columns.filter(c=>c.group!=='buy');
  let h='',grp=null,open=false;
  for(const it of rows){
    const g=it.cat1+(it.cat2?' › '+it.cat2:'');
    if(g!==grp){if(open)h+='</div>';h+='<div class="grp">'+esc(g)+'</div><div class="items">';grp=g;open=true}
    let cost=null;for(const c of buys){const e=A.entryAt(it.id,c.key,d);if(A.hasVal(e)){cost=e;break}}
    const n=sells.filter(c=>A.isNum(A.entryAt(it.id,c.key,d))).length;
    const chg=A.DB.columns.some(c=>A.isChanged(A.entryAt(it.id,c.key,d),since));
    const fut=A.DB.columns.some(c=>A.hasFuture(it.id,c.key,d));
    h+='<button class="irow" type="button" data-item="'+esc(it.id)+'"><span class="l"><span class="m">'+esc(A.itemName(it))+'</span>'+(A.isFav(it.id)?'<span class="star">★</span>':'')+(chg?'<span class="dot" title="최근 30일 변경"></span>':'')+(fut?' <span class="tag fut">예정</span>':'')+'<br><span class="s">판매처 '+n+'곳</span></span><span class="r">'+(cost?A.eHtml(cost,d):'<span class="hint">-</span>')+'<small>매입가</small></span><span class="chev">›</span></button>';
  }
  if(open)h+='</div>';
  el.innerHTML=h+'<div class="row" style="justify-content:space-between;margin-top:10px"><span class="hint">주황 점: 최근 30일 안에 바뀐 단가가 있음</span><button class="btn" type="button" data-additem>+ 품목 추가</button></div>';
}

/* ---------- item detail ---------- */
function renderItem(){
  const el=$('#v-item'),it=A.ITEM.get(curItem);
  if(!it){location.hash='#prices';return}
  const d=date(),since=addDays(d,-30),lm=A.lowMargin();
  $('#title').textContent=A.itemName(it);
  document.querySelectorAll('#krwSeg button').forEach(b=>b.setAttribute('aria-selected',String((b.dataset.k==='1')===A.view.krw)));
  const row=c=>{
    const e=A.entryAt(it.id,c.key,d),has=A.hasVal(e);
    if(!has&&!showAll&&!A.hasFuture(it.id,c.key,d))return '';
    let sub=[];
    if(e&&!e.base)sub.push('<span>'+esc(e.from)+'부터</span>'+A.deltaHtml(A.delta(A.prevOf(e),e)));
    if(A.hasFuture(it.id,c.key,d)){const h=A.hist(it.id,c.key),f=h[h.length-1];sub.push('<span class="tag fut">'+esc(f.from)+' 예정 '+esc(A.eText(f))+'</span>')}
    if(showMargin&&c.group!=='buy'){const r=A.marginOf(it,c,d,A.basis());if(r)sub.push(r.unknown?'<span>마진: 원가·환율 필요</span>':'<span>마진 <b class="mg'+(r.m<0?' neg':r.p<lm?' low':'')+'">'+esc(A.fmtN(Math.round(r.m*100)/100))+'원 · '+r.p.toFixed(1)+'%</b></span>')}
    const kn=has?A.krwNote(e,d):'';if(kn&&!A.view.krw)sub.push('<span>'+esc(kn)+'</span>');
    return '<div class="prow'+(A.isChanged(e,since)?' chg':'')+(has?'':' none')+'" data-i="'+esc(it.id)+'" data-c="'+esc(c.key)+'" role="button" tabindex="0"><span class="n">'+esc(c.name)+'</span><span class="v">'+(has?A.eHtml(e,d):'없음')+'</span>'+(sub.length?'<span class="sub">'+sub.join('')+'</span>':'')+'</div>';
  };
  const buy=A.DB.columns.filter(c=>c.group==='buy').map(row).join(''),sell=A.DB.columns.filter(c=>c.group!=='buy').map(row).join('');
  const notice=A.itemMarginNotice(it.id,d);
  el.innerHTML='<div class="detail-head"><div class="row" style="justify-content:space-between;align-items:flex-start"><span class="hint">'+esc(A.itemLabel(it))+'</span><div class="row"><button class="btn small" type="button" data-fav-toggle aria-pressed="'+A.isFav(it.id)+'">'+(A.isFav(it.id)?'★ 즐겨찾기':'☆ 즐겨찾기')+'</button><button class="btn small" type="button" data-edititem>수정 · 삭제</button></div></div><span class="m">'+esc(it.model||'(모델 없음)')+'</span><span class="hint">'+esc(d)+' 기준 · 칸을 누르면 이력과 단가 변경</span></div>'+
    (notice?'<div class="status-line err">'+esc(notice)+'</div>':'')+
    '<div class="row"><label class="check"><input type="checkbox" id="optAll"'+(showAll?' checked':'')+'> 거래 없는 곳도 보기</label><label class="check"><input type="checkbox" id="optMg"'+(showMargin?' checked':'')+'> 마진 보기</label></div>'+
    '<div class="grp">매입가</div><div class="items">'+(buy||'<div class="prow none"><span class="n hint">매입가 없음</span></div>')+'</div>'+
    '<div class="grp">판매가</div><div class="items">'+(sell||'<div class="prow none"><span class="n hint">판매처 없음 · "거래 없는 곳도 보기"를 켜고 추가하세요</span></div>')+'</div>';
  $('#optAll').addEventListener('change',e=>{showAll=e.target.checked;renderItem()});
  $('#optMg').addEventListener('change',e=>{showMargin=e.target.checked;renderItem()});
  el.querySelector('[data-edititem]').addEventListener('click',()=>A.editItemDialog(it.id,{onDelete:()=>{location.hash='#prices'}}));
  el.querySelector('[data-fav-toggle]').addEventListener('click',()=>A.toggleFav(it.id));
}

/* ---------- bottom sheet (price history + change form) ---------- */
function openSheet(i,c){
  const it=A.ITEM.get(i),col=A.COL.get(c);if(!it||!col)return;sheetCell={i,c};
  $('#sPath').textContent=A.itemLabel(it);$('#sModel').textContent=A.itemName(it);$('#sCol').textContent=col.name+(col.group==='buy'?' · 매입가':' · 판매가');
  A.renderCell($('#sBody'),i,c,{date:date()});$('#sheet').hidden=false;$('#sheetBg').hidden=false;$('#sBody').scrollTop=0;
}
function closeSheet(){$('#sheet').hidden=true;$('#sheetBg').hidden=true;sheetCell=null;render()}
$('#sClose').addEventListener('click',closeSheet);$('#sheetBg').addEventListener('click',closeSheet);
document.addEventListener('danga:undo',()=>{if(sheetCell&&!$('#sheet').hidden)A.renderCell($('#sBody'),sheetCell.i,sheetCell.c,{date:date()})});

const addItem=()=>A.addItemDialog({cat1:cat||undefined,date:date(),onDone:(it,n)=>{if(n===1&&it){curItem=it.id;A.LS.set('danga.m.item',curItem);location.hash='#item'}}});
document.addEventListener('click',ev=>{
  if(ev.target.closest('#modal')||ev.target.closest('#curpick'))return;
  if(ev.target.closest('[data-additem]')){addItem();return}
  if(ev.target.closest('[data-fav]')){favOnly=!favOnly;renderPrices();return}
  const ch=ev.target.closest('[data-cat]');if(ch){cat=ch.dataset.cat;renderPrices();return}
  const ir=ev.target.closest('[data-item]');if(ir){curItem=ir.dataset.item;A.LS.set('danga.m.item',curItem);location.hash='#item';return}
  const t=ev.target.closest('[data-i][data-c]');if(t&&!ev.target.closest('#sheet'))openSheet(t.dataset.i,t.dataset.c);
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.matches('.prow[data-i]'))openSheet(ev.target.dataset.i,ev.target.dataset.c)});

/* ---------- navigation ---------- */
const cur=()=>{const v=location.hash.slice(1);return VIEWS.includes(v)?v:'home'};
const ctx={
  date:()=>date(),cat:()=>cat,
  find:()=>{location.hash='#prices';setTimeout(()=>$('#q').focus(),80)},
  goto:name=>{if(name==='upcoming'){location.hash='#analysis';anaHub.show('upcoming')}else if(name==='fx'){keepMoreTab=true;location.hash='#more';moreHub.show('margin')}else if(name==='settings'){keepMoreTab=true;location.hash='#more';moreHub.show('settings')}else location.hash='#'+name}
};
function render(){
  const v=cur();
  if(v==='home')homeHub.refresh();
  else if(v==='prices')renderPrices();
  else if(v==='item')renderItem();
  else if(v==='history')hist.refresh();
  else if(v==='analysis')anaHub.refresh();
  else if(v==='more')moreHub.refresh();
}
function route(){
  const v=cur();VIEWS.forEach(x=>$('#v-'+x).hidden=x!==v);
  const tab=v==='item'?'prices':v;
  document.querySelectorAll('#tabbar a').forEach(a=>{if(a.dataset.tab===tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('#back').hidden=v!=='item';$('#searchBar').hidden=v!=='prices'&&v!=='item';$('#q').hidden=v==='item';$('#chips').hidden=v==='item';
  if(v!=='item')$('#title').textContent=TITLES[v]||'단가 관리';
  if(v==='more'&&!keepMoreTab)moreHub.show('tools');keepMoreTab=false;
  render();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
$('#back').addEventListener('click',()=>{if(history.length>1)history.back();else location.hash='#prices'});
$('#q').addEventListener('input',renderPrices);
$('#date').addEventListener('input',()=>{$('#dateNote').textContent=date()===today()?'(오늘)':'';render()});
$('#krwSeg').addEventListener('click',ev=>{const b=ev.target.closest('button[data-k]');if(b)A.setKrw(b.dataset.k==='1')});
$('#btnSave').addEventListener('click',()=>A.save());
$('#btnUndo').innerHTML=A.icon('undo',22);A.bindUndo($('#btnUndo'));
let rT;A.onChange(()=>{A.renderPill($('#pill'));$('#btnSave').disabled=A.isBusy();clearTimeout(rT);rT=setTimeout(()=>{if(!sheetCell||$('#sheet').hidden)render();else if(cur()==='more')moreHub.refresh()},30)});

/* ---------- boot ---------- */
$('#date').value=today();$('#dateNote').textContent='(오늘)';
homeHub=A.mountHome($('#homeBox'),ctx);
hist=A.mountHistory($('#v-history'),{cards:true});
anaHub=A.mountTabs($('#anaBox'),[{id:'diff',label:'변경 비교',mount:el=>A.mountAnalysis(el,{cards:true})},{id:'compare',label:'거래처 비교',mount:el=>A.mountCompare(el)},{id:'upcoming',label:'예정 단가',mount:el=>A.mountUpcoming(el)}],'ana');
moreHub=A.mountTabs($('#moreBox'),[
  {id:'tools',label:'도구',mount:el=>A.mountTools(el,ctx)},
  {id:'margin',label:'마진·환율',mount:el=>{el.innerHTML='<div id="simBox"></div><div class="section" id="fxBox"></div>';const sim=A.mountSim($('#simBox')),fx=A.mountFx($('#fxBox'));return{refresh(){sim.refresh();fx.refresh()}}}},
  {id:'manage',label:'관리',mount:el=>{el.innerHTML='<div class="cols-1" id="manageBox"></div>';return A.mountManage($('#manageBox'))}},
  {id:'settings',label:'설정',mount:el=>{el.innerHTML='<div class="cols-1" id="setupBox"></div>';return A.mountSettings($('#setupBox'))}}
